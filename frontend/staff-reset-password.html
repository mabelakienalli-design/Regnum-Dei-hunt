<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Staff Password | REGNUM DEI</title>
    <link rel="stylesheet" href="css/staff-login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/staff-reset-password.js"></script>
</head>
<body>
    <main class="login-container"><section class="login-card">
        <div class="brand"><h1>REGNUM DEI</h1><p>STAFF PORTAL</p></div>
        <div class="divider"></div>
        <h2>Reset Password</h2>
        <p class="subtitle">Choose a new password for your staff account.</p>
        <form id="resetForm">
            <div class="form-group"><label for="newPassword">New Password</label><input type="password" id="newPassword" minlength="10" required></div>
            <div class="form-group"><label for="confirmPassword">Confirm New Password</label><input type="password" id="confirmPassword" minlength="10" required></div>
            <p id="resetMessage" class="error-message" aria-live="polite"></p>
            <button type="submit" id="resetButton">Update Password</button>
        </form>
        <p style="text-align:center; margin-top:20px;"><a href="staff-login.html" style="color:#d6b45b;">Back to Staff Login</a></p>
    </section></main>
</body>
</html>
