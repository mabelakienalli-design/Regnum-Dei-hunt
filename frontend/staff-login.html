<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | REGNUM DEI</title>
    <link rel="stylesheet" href="css/staff-login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/staff-login.js"></script>
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <div class="brand"><h1>REGNUM DEI</h1><p>STAFF PORTAL</p></div>
            <div class="divider"></div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to access your staff dashboard.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <p id="errorMessage" class="error-message"></p>
                <button type="submit" id="loginButton">Sign In</button>
            </form>
            <p style="text-align:center; margin-top:18px;">
                <a href="#" id="forgotPasswordLink" style="color:#d6b45b;">Forgot Password?</a>
            </p>
            <form id="recoveryForm" hidden style="margin-top:20px;">
                <div class="form-group">
                    <label for="recoveryEmail">Enter your staff email address</label>
                    <input type="email" id="recoveryEmail" placeholder="Enter your email" required>
                </div>
                <p id="recoveryMessage" class="subtitle" aria-live="polite"></p>
                <button type="submit" id="recoveryButton">Send Password Reset Link</button>
            </form>
            <p class="footer-text">Authorised personnel only.</p>
        </section>
    </main>
</body>
</html>
