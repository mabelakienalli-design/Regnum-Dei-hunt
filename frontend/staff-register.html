<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration | REGNUM DEI</title>

    <link rel="stylesheet" href="css/staff-login.css">
    <script defer src="js/staff-register.js"></script>
</head>

<body>

    <main class="login-container">
        <section class="login-card">

            <div class="brand">
                <h1>REGNUM DEI</h1>
                <p>STAFF PORTAL</p>
            </div>

            <div class="divider"></div>

            <h2>Join the Team</h2>
            <p class="subtitle" id="invitationMessage">
                Verifying your invitation...
            </p>

            <form id="registerForm" hidden>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="department">Department (Optional)</label>
                    <input type="text" id="department">
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" minlength="10" required>
                </div>

                <p id="errorMessage" class="error-message"></p>

                <button type="submit" id="registerButton">
                    Create Account
                </button>

            </form>

            <p class="footer-text">
                Authorised invitation required.
            </p>

        </section>
    </main>

</body>
</html>
